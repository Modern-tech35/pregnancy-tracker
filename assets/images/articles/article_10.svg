  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- steam -->
  <g stroke="#FBCFE8" stroke-width="12" fill="none" stroke-linecap="round">
    <path d="M330 220 q-22 -32 0 -64 q22 -32 0 -64"/>
    <path d="M420 220 q-22 -32 0 -64 q22 -32 0 -64"/>
  </g>

  <!-- mug -->
  <rect x="300" y="240" width="180" height="150" rx="22" fill="#F472B6"/>
  <rect x="300" y="240" width="180" height="150" rx="22" fill="none" stroke="#DB2777" stroke-width="7"/>
  <path d="M480 275 q70 0 70 52 q0 52 -70 52" stroke="#F472B6" stroke-width="22" fill="none"/>
  <ellipse cx="390" cy="415" rx="175" ry="26" fill="#F9A8D4"/>

  <!-- no sign -->
  <circle cx="390" cy="310" r="115" fill="none" stroke="#F87171" stroke-width="16"/>
  <line x1="305" y1="225" x2="475" y2="395" stroke="#F87171" stroke-width="16" stroke-linecap="round"/>

  <!-- coffee bean -->
  <ellipse cx="390" cy="540" rx="45" ry="26" fill="#DB2777"/>
  <path d="M390 514 q-14 26 0 52" stroke="#BE185D" stroke-width="7" fill="none"/>
