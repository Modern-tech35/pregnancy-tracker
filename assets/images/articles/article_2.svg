<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- ground -->
  <ellipse cx="420" cy="500" rx="260" ry="22" fill="#F9A8D4" opacity="0.5"/>

  <!-- motion lines -->
  <g stroke="#F9A8D4" stroke-width="10" stroke-linecap="round">
    <line x1="180" y1="210" x2="240" y2="210"/>
    <line x1="160" y1="270" x2="225" y2="270"/>
    <line x1="185" y1="330" x2="240" y2="330"/>
  </g>

  <!-- walking figure -->
  <g>
    <circle cx="370" cy="185" r="50" fill="#FFE4E6"/>
    <circle cx="370" cy="185" r="50" fill="none" stroke="#F9A8D4" stroke-width="5"/>
    <path d="M345 180 q25 20 50 0" stroke="#BE185D" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M350 210 q20 16 40 0" stroke="#BE185D" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- arms -->
    <path d="M335 245 q-45 15 -55 70" stroke="#EC4899" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M405 245 q45 10 55 65" stroke="#EC4899" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- torso + belly -->
    <rect x="332" y="232" width="78" height="115" rx="36" fill="#EC4899"/>
    <circle cx="392" cy="310" r="44" fill="#DB2777"/>
    <!-- legs split -->
    <path d="M350 342 q10 40 -10 100" stroke="#F472B6" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M392 342 q20 50 60 95" stroke="#F472B6" stroke-width="24" fill="none" stroke-linecap="round"/>
    <!-- feet -->
    <ellipse cx="332" cy="470" rx="26" ry="13" fill="#DB2777" transform="rotate(-20 332 470)"/>
    <ellipse cx="470" cy="470" rx="26" ry="13" fill="#DB2777" transform="rotate(10 470 470)"/>
  </g>

  <!-- heart -->
  <g fill="#EC4899">
    <circle cx="655" cy="220" r="15"/>
    <circle cx="683" cy="220" r="15"/>
    <path d="M624 226 L714 226 L669 260 z"/>
  </g>

  <!-- sparkle -->
  <path d="M660 360 l8 17 17 8 -17 8 -8 17 -8 -17 -17 -8 17 -8 z" fill="#FBBF24"/>
</svg>
