  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- bag -->
  <path d="M220 320 h300 q22 0 22 22 v170 q0 22 -22 22 h-300 q-22 0 -22 -22 v-170 q0 -22 22 -22 z" fill="#EC4899"/>
  <path d="M285 320 q0 -80 65 -80 q65 0 65 80" stroke="#EC4899" stroke-width="24" fill="none"/>

  <!-- heart on bag -->
  <g fill="#FFFFFF">
    <circle cx="362" cy="390" r="15"/>
    <circle cx="392" cy="390" r="15"/>
    <path d="M332 396 L422 396 L377 434 z"/>
  </g>

  <!-- onesie -->
  <g transform="translate(600 380) rotate(12)">
    <rect x="0" y="0" width="56" height="100" rx="24" fill="#FBCFE8"/>
    <rect x="0" y="0" width="56" height="100" rx="24" fill="none" stroke="#F9A8D4" stroke-width="4"/>
    <rect x="14" y="4" width="28" height="20" rx="10" fill="#FFFFFF"/>
    <rect x="0" y="96" width="56" height="14" rx="7" fill="#F9A8D4"/>
  </g>

  <!-- bottle -->
  <g>
    <rect x="130" y="320" width="80" height="120" rx="24" fill="#FFFFFF"/>
    <rect x="130" y="320" width="80" height="120" rx="24" fill="none" stroke="#F9A8D4" stroke-width="4"/>
    <rect x="148" y="272" width="44" height="48" rx="10" fill="#DB2777"/>
    <rect x="130" y="332" width="18" height="96" rx="9" fill="#FBCFE8"/>
  </g>

  <!-- pacifier -->
  <g>
    <circle cx="660" cy="240" r="34" fill="#F472B6"/>
    <circle cx="660" cy="240" r="13" fill="#FFFFFF"/>
    <rect x="648" y="274" width="24" height="26" rx="10" fill="#F472B6"/>
    <rect x="616" y="288" width="88" height="18" rx="9" fill="#FBCFE8"/>
