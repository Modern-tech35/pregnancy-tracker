<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- sun -->
  <circle cx="660" cy="140" r="52" fill="#FBBF24"/>
  <g stroke="#FBBF24" stroke-width="10" stroke-linecap="round">
    <line x1="660" y1="60" x2="660" y2="86"/>
    <line x1="660" y1="194" x2="660" y2="220"/>
    <line x1="580" y1="140" x2="606" y2="140"/>
    <line x1="714" y1="140" x2="740" y2="140"/>
    <line x1="603" y1="83" x2="622" y2="102"/>
    <line x1="698" y1="83" x2="679" y2="102"/>
    <line x1="603" y1="197" x2="622" y2="178"/>
    <line x1="698" y1="197" x2="679" y2="178"/>
  </g>

  <!-- jar -->
  <g>
    <rect x="300" y="330" width="200" height="160" rx="28" fill="#FFFFFF"/>
    <rect x="300" y="330" width="200" height="160" rx="28" fill="none" stroke="#FBCFE8" stroke-width="6"/>
    <rect x="280" y="275" width="240" height="70" rx="18" fill="#DB2777"/>
    <ellipse cx="400" cy="345" rx="120" ry="18" fill="#EC4899"/>
    <path d="M400 275 q30 -20 60 0 q-30 -40 -60 0 z" fill="#FFFFFF"/>
  </g>

  <!-- flower -->
  <g>
    <ellipse cx="150" cy="255" rx="26" ry="52" fill="#FFFFFF" transform="rotate(0 150 255)"/>
    <ellipse cx="150" cy="255" rx="26" ry="52" fill="#FFFFFF" transform="rotate(60 150 255)"/>
    <ellipse cx="150" cy="255" rx="26" ry="52" fill="#FFFFFF" transform="rotate(120 150 255)"/>
    <circle cx="150" cy="255" r="22" fill="#FBBF24"/>
  </g>

  <!-- stem and leaf -->
  <path d="M150 307 q10 40 -10 70" stroke="#34D399" stroke-width="9" fill="none" stroke-linecap="round"/>
  <ellipse cx="168" cy="352" rx="16" ry="9" fill="#6EE7B7" transform="rotate(-30 168 352)"/>

  <!-- sparkles -->
  <path d="M120 120 l8 17 17 8 -17 8 -8 17 -8 -17 -17 -8 17 -8 z" fill="#F472B6"/>
  <path d="M560 460 l8 17 17 8 -17 8 -8 17 -8 -17 -17 -8 17 -8 z" fill="#F9A8D4"/>

  <!-- droplets -->
  <ellipse cx="540" cy="280" rx="16" ry="22" fill="#FBCFE8"/>
  <ellipse cx="566" cy="322" rx="12" ry="16" fill="#F9A8D4"/>
</svg>
