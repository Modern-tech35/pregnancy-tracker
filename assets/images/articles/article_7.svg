<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- plate -->
  <circle cx="320" cy="330" r="210" fill="#FFFFFF"/>
  <circle cx="320" cy="330" r="210" fill="none" stroke="#FBCFE8" stroke-width="8"/>
  <circle cx="320" cy="330" r="155" fill="#FDF2F8"/>

  <!-- fish -->
  <g>
    <ellipse cx="300" cy="300" rx="85" ry="48" fill="#F9A8D4"/>
    <path d="M385 300 l55 -35 0 70 z" fill="#F9A8D4"/>
    <circle cx="252" cy="282" r="9" fill="#BE185D"/>
    <path d="M330 285 q12 -14 24 0" stroke="#BE185D" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- x -->
    <g stroke="#F87171" stroke-width="14" stroke-linecap="round">
      <line x1="270" y1="255" x2="350" y2="345"/>
      <line x1="350" y1="255" x2="270" y2="345"/>
    </g>
  </g>

  <!-- crossed coffee cup -->
  <g>
    <rect x="520" y="360" width="120" height="100" rx="16" fill="#F472B6"/>
    <rect x="520" y="360" width="120" height="100" rx="16" fill="none" stroke="#DB2777" stroke-width="6"/>
    <path d="M640 385 q55 0 55 40 q0 40 -55 40" stroke="#F472B6" stroke-width="20" fill="none"/>
    <path d="M545 330 q-18 -26 0 -52 q18 -26 0 -52" stroke="#FBCFE8" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M615 330 q-18 -26 0 -52 q18 -26 0 -52" stroke="#FBCFE8" stroke-width="10" fill="none" stroke-linecap="round"/>
    <ellipse cx="580" cy="470" rx="130" ry="20" fill="#F9A8D4"/>
    <g stroke="#F87171" stroke-width="14" stroke-linecap="round">
      <line x1="525" y1="365" x2="635" y2="455"/>
      <line x1="635" y1="365" x2="525" y2="455"/>
    </g>
  </g>
</svg>
