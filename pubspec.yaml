name: pregn_4
description: "flutter app for tracking pregnancy."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.1


dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  easy_localization: ^3.0.1
  http: ^1.1.0
  cupertino_icons: ^1.0.8
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 
    

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:


  uses-material-design: true
  assets:
    - assets/translations/
    
